name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: ops scripts smoke
        run: |
          go run ./scripts/replay_events.go -h > /dev/null
          go run ./scripts/compare_reports.go -h > /dev/null

  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nodelogs_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: appsecret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d nodelogs_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: migration check
        env:
          TEST_DATABASE_URL: postgres://app:appsecret@127.0.0.1:5432/nodelogs_test?sslmode=disable
        run: go test -count=1 ./internal/store/ -run 'TestMigrate|TestMigration|TestUsersUsernameUnique|TestPurgeRawEvents'

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install
        run: yarn install --frozen-lockfile
      - name: sdk test
        run: node --test src/sdk.test.js
      - name: sdk build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: yarn build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build .
