<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
    <p>hello Word</p>
    <h2></h2>
    <button id="btn">按钮</button>

    <script>
        var netWork = navigator && navigator.connection && navigator.connection.effectiveType;
        document.querySelector('h2').innerHTML = netWork;
    </script>

    <script src="./src/index.js"></script>
    <script>
        // 默认上报同源 /pingd/front/web（Go 兼容入口）；跨域部署时配置完整地址：
        // siteH5.configure({ collectUrl: 'https://collect.example.com/pingd/front/web', pvid: '800800' });
        siteH5.configure({ pvid: '800800' });
        siteH5.pgv();
        var btnEl = document.getElementById('btn')
        btnEl.addEventListener('click' , function (ev) {
            siteH5.clickStat('BTN_CLICK')
        },false)
    </script>
</body>
